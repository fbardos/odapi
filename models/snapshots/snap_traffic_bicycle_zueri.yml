snapshots:
  - name: snap_traffic_bicycle_zueri
    config:
      target_schema: snapshots
      strategy: check
      unique_key: sk
      check_cols:
        - velo_in
        - velo_out
        - fuss_in
        - fuss_out
        - ost
        - nord
      # cannot be used together with invalidate hard deletes
      # and historical backfills (paritions)
      updated_at: _partition_datetime
