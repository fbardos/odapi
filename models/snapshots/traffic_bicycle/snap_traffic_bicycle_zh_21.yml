version: 2

snapshots:
  - name: snap_traffic_bicycle_zh_21
    config:
      target_schema: snapshots
      strategy: check
      unique_key: sk
      check_cols:
        - gemeinde_bfs_nr
        - gemeinde
        - lat
        - lon
        - anzahl
      # cannot be used together with invalidate hard deletes
      # and historical backfills (paritions)
      updated_at: _partition_datetime
