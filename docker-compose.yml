# #######################################################################
# Config snippets
# #######################################################################
x-restart-policy: &restart-policy unless-stopped

x-logging: &default-logging
  options:
    max-size: "100m"
    max-file: "3"

x-logging-extended: &extended-logging
  options:
    max-size: "1000m"
    max-file: "3"

services:
  # #######################################################################
  # Data services
  # #######################################################################
  data-postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile.pg_parquet
    restart: *restart-policy
    profiles:
      - dev
      - prod
    environment:
      POSTGRES_USER: ${STORAGE__PSQL__USER}
      POSTGRES_PASSWORD: ${STORAGE__PSQL__PASSWORD}
      POSTGRES_DB: ${STORAGE__PSQL__DB}
      PAGER: "less -FRX" # used for paging psql output
      # overwrite system wide default of PAGER for data
      PSQL_PAGER: "pspg --no-mouse --quit-if-one-screen -s 0"
    volumes:
      - data-postgis:/var/lib/postgresql/data
    logging: *extended-logging
    ports:
      # Port must be external for host, because Airbyte spawns docker containers
      # when doing an EL-Task. These containers are not within the network odapi_public.
      - "127.0.0.1:4003:5432"
    networks:
      - odapi_private
      - odapi_public
    healthcheck:
      test: pg_isready -U ${STORAGE__PSQL__USER} || exit 1
      interval: 5s
      retries: 5
    shm_size: 24gb
    # For debugging queries, log all statements (only for DEV)
    command: >
      -c shared_buffers=8GB
      -c effective_cache_size=40GB
      -c work_mem=128MB
      -c maintenance_work_mem=2GB
      -c max_parallel_workers_per_gather=2
      -c max_worker_processes=8
      -c max_parallel_workers=8
      -c random_page_cost=1.1
      -c effective_io_concurrency=256
      -c checkpoint_timeout=30min
      -c max_wal_size=8GB
      -c min_wal_size=2GB
      -c wal_compression=on
      -c log_statement=all
      -c log_min_duration_statement=1000

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse
    restart: unless-stopped
    profiles:
      - dev
      - prod
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:8124:8124"
      - "127.0.0.1:9001:9000"
    expose:
      - "8124"
    environment:
      CLICKHOUSE_DB: ${STORAGE__CLICKHOUSE__DB}
      CLICKHOUSE_USER: ${STORAGE__CLICKHOUSE__USER}
      CLICKHOUSE_PASSWORD: ${STORAGE__CLICKHOUSE__PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./api/public-api.xml:/etc/clickhouse-server/config.d/public-api.xml:ro
    networks:
      - odapi_private
      - odapi_public
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # Public dataset and metadata endpoints.
      # Block SQL query submission and authentication overrides.
      - >-
        traefik.http.routers.odapi.rule=
        Host(`odapi.bardos.dev`)
        && Method(`GET`)
        && (
          Path(`/tables`)
          || Path(`/columns`)
          || PathRegexp(`^/marts/[A-Za-z_][A-Za-z0-9_]*(?:[.](?:csv|json|parquet))?$`)
        )
        && !QueryRegexp(`query`, `(?s)^.*$`)
        && !QueryRegexp(`user`, `(?s)^.*$`)
        && !QueryRegexp(`password`, `(?s)^.*$`)
        && !QueryRegexp(`session_id`, `(?s)^.*$`)
        && !QueryRegexp(`role`, `(?s)^.*$`)
        && !QueryRegexp(`database`, `(?s)^.*$`)

      - "traefik.http.routers.odapi.priority=1000"
      - "traefik.http.routers.odapi.entrypoints=websecure"
      - "traefik.http.routers.odapi.tls=true"
      - "traefik.http.routers.odapi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.odapi.service=odapi-clickhouse"
      - "traefik.http.services.odapi-clickhouse.loadbalancer.server.port=8124"

      # Translate /marts/table to /data_marts/table.
      - "traefik.http.middlewares.odapi-rewrite.replacepathregex.regex=^/marts/(.+)$"
      - "traefik.http.middlewares.odapi-rewrite.replacepathregex.replacement=/data_marts/$$1"

      # Remove credentials and force the public identity.
      - "traefik.http.middlewares.odapi-identity.headers.customrequestheaders.Authorization="
      - "traefik.http.middlewares.odapi-identity.headers.customrequestheaders.X-ClickHouse-User=public_api"
      - "traefik.http.middlewares.odapi-identity.headers.customrequestheaders.X-ClickHouse-Key="
      - "traefik.http.middlewares.odapi-identity.headers.customrequestheaders.X-ClickHouse-Role="
      - "traefik.http.middlewares.odapi-identity.headers.customrequestheaders.X-ClickHouse-Database="
      - "traefik.http.middlewares.odapi-identity.headers.customrequestheaders.X-ClickHouse-Quota="
      - "traefik.http.middlewares.odapi-identity.headers.customrequestheaders.Cookie="

      # Request rate limiting (per client IP by default).
      - "traefik.http.middlewares.odapi-limit.ratelimit.average=30"
      - "traefik.http.middlewares.odapi-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.odapi-limit.ratelimit.burst=10"

      # Limit request bodies, not downloaded response sizes.
      - "traefik.http.middlewares.odapi-body.buffering.maxRequestBodyBytes=1"
      - "traefik.http.routers.odapi.middlewares=odapi-identity,odapi-limit,odapi-body,odapi-rewrite"

      # Redirect the domain root to the table catalog.
      - "traefik.http.routers.odapi-root.rule=Host(`odapi.bardos.dev`) && Path(`/`) && Method(`GET`)"
      - "traefik.http.routers.odapi-root.priority=1000"
      - "traefik.http.routers.odapi-root.entrypoints=websecure"
      - "traefik.http.routers.odapi-root.tls=true"
      - "traefik.http.routers.odapi-root.service=odapi-clickhouse"
      - "traefik.http.routers.odapi-root.middlewares=odapi-root-redirect"
      - "traefik.http.middlewares.odapi-root-redirect.redirectregex.regex=^https://odapi[.]bardos[.]dev/.*$"
      - "traefik.http.middlewares.odapi-root-redirect.redirectregex.replacement=https://odapi.bardos.dev/tables"
      - "traefik.http.middlewares.odapi-root-redirect.redirectregex.permanent=false"

  data-minio:
    image: minio/minio
    restart: *restart-policy
    volumes:
      - data-minio:/data
    profiles:
      - dev
      - prod
    environment:
      MINIO_ROOT_USER: ${MINIO__ROOT__USER}
      MINIO_ROOT_PASSWORD: ${MINIO__ROOT__PASSWORD}
    ports:
      - 4001:9000
      - 4002:9090
    networks:
      - odapi_private
      - odapi_public
    logging: *extended-logging
    command: server /data --console-address ":9090"

  data-redis:
    image: redis
    restart: *restart-policy
    logging: *extended-logging
    profiles:
      - dev
      - prod
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "127.0.0.1:4004:6379"
    networks:
      - odapi_private
      - odapi_public
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # #######################################################################
  # UTILS
  # #######################################################################
  utils-pgadmin:
    image: dpage/pgadmin4
    restart: *restart-policy
    ports:
      - "4005:80"
    profiles:
      - dev
      - prod
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN__DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN__DEFAULT_PASSWORD}
    volumes:
      - utils-pgadmin:/var/lib/pgadmin
    networks:
      - odapi_public
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # #######################################################################
  # Docs (mkdocs)
  # #######################################################################
  mkdocs:
    build:
      context: .
      dockerfile: docker/mkdocs/Dockerfile
    ports:
      - "8001:80"
    restart: unless-stopped

  # #######################################################################
  # DAGSTER
  # #######################################################################
  dagster-webserver:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
      secrets:
        - git_token
    restart: *restart-policy
    init: true
    profiles:
      - prod
    environment:
      - DAGSTER__PSQL_META__HOST=${DAGSTER__PSQL_META__HOST}
      - DAGSTER__PSQL_META__DB=${DAGSTER__PSQL_META__DB}
      - DAGSTER__PSQL_META__USER=${DAGSTER__PSQL_META__USER}
      - DAGSTER__PSQL_META__PASS=${DAGSTER__PSQL_META__PASS}
    expose:
      - "3000"
    ports:
      - "127.0.0.1:4006:3000"
    volumes:
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - odapi_public
      - odapi_private
    depends_on:
      - data-postgis

  dagster-daemon:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
      secrets:
        - git_token
    restart: *restart-policy
    init: true
    entrypoint:
      - dagster-daemon
      - run
      - -f
      - "odapi/definitions.py"
    profiles:
      - prod
    environment:
      - DAGSTER__PSQL_META__HOST=${DAGSTER__PSQL_META__HOST}
      - DAGSTER__PSQL_META__DB=${DAGSTER__PSQL_META__DB}
      - DAGSTER__PSQL_META__USER=${DAGSTER__PSQL_META__USER}
      - DAGSTER__PSQL_META__PASS=${DAGSTER__PSQL_META__PASS}
    volumes:
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - odapi_public
      - odapi_private
    depends_on:
      - data-postgis

# #######################################################################
# VOLUMES
# #######################################################################
volumes:
  data-minio:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storagebox/docker/volumes/odapi-data-minio/_data
  data-postgis:
  utils-pgadmin:
  clickhouse-data:

# #######################################################################
# Networks
# #######################################################################
networks:
  odapi_public:
  odapi_private:
  proxy:
    name: ${PROXY_NETWORK_NAME:-proxy-dev}
    external: ${PROXY_NETWORK_EXTERNAL:-false}

# #######################################################################
# Secrets
# #######################################################################
secrets:
  git_token:
    file: ./docker/.deploy/git_token.txt
